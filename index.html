<body>
<div id="mainView" class="view active">
<header>
  <div class="topline"><div class="spacer"></div><button id="menuButton" class="summary-btn menu-button" aria-label="メニュー">☰</button></div>

</header>
<main>
<div id="editingBanner" class="editing-banner"></div>
<section class="section ear-section">

<label class="ear-label second-label" for="earTag">耳標</label>

<section class="section">

</section>
<section class="section"><hr><div class="section-title"><h2>その他の処置</h2></div>

<div id="otherDraftList" class="other-draft-list"></div>

<section class="section"><hr><div class="section-title"><h2>今日の診療</h2></div><div id="todayVisits"></div></section>
<div class="bottom-save-wrap"><div class="bottom-draft"><span>今回</span><strong id="draftTotal">¥0</strong></div><button id="saveVisit" class="save-visit bottom-save" disabled>この診療を保存</button></div>
</main>
</div>


<div id="menuOverlay" class="menu-overlay"><div class="menu-sheet"><div class="menu-sheet-head"><strong>メニュー</strong><button id="closeMenu" class="menu-close">×</button></div><button id="menuSummary" class="menu-item">集計 <span>›</span></button><button id="menuSettings" class="menu-item">設定 <span>›</span></button></div></div>
<div id="settingsView" class="view"><main><button id="closeSettings" class="backbtn">‹ 戻る</button><div class="settings-title">設定</div><section class="settings-card"><h2>処置マスター管理</h2><p class="settings-note">現在の処置名・B−A点・表示区分をCSVで書き出したり、編集したCSVを読み込んで更新できます。</p><button id="exportMaster" class="settings-action">CSVをエクスポート</button><button id="importMasterButton" class="settings-action secondary">CSVをインポート</button><input id="importMasterFile" type="file" accept=".csv,text/csv" hidden><div id="masterMessage" class="master-message"></div></section><section class="settings-card"><div class="master-head"><h2>現在のマスター</h2><span id="masterCount"></span></div>

<label class="master-field-label">区分</label><select id="masterCategoryInput" class="master-field-input"><option value="quick">よく使う処置</option><option value="other">その他の処置</option></select>

</div>

// One-time migration: old day-based entries become one legacy visit per day.
if(!Object.keys(data).length){
  const oldDaily=JSON.parse(localStorage.getItem(OLD_KEY)||"{}");
  if(Object.keys(oldDaily).length){
    Object.entries(oldDaily).forEach(([k,items])=>{
      if(items?.length)data[k]=[{id:uid(),createdAt:new Date().toISOString(),items:items.map(e=>({...e,id:e.id||uid()})),legacy:true}];

    if(oldest.length)data[todayKey()]=[{id:uid(),createdAt:new Date().toISOString(),items:oldest,legacy:true}];

}

function grouped(items){

 items.forEach(e=>{let g=map.get(e.name)||{quantity:0,subtotal:0};g.quantity+=e.quantity;g.subtotal+=e.point*e.quantity;map.set(e.name,g)});

}

function animateRevenue(from,to){
 const el=document.getElementById("total");
 const duration=650,start=performance.now();
 el.classList.remove("revenue-pop"); void el.offsetWidth; el.classList.add("revenue-pop");
 function frame(now){
   const p=Math.min(1,(now-start)/duration);
   const eased=1-Math.pow(1-p,3);
   el.textContent=yen(Math.round(from+(to-from)*eased));
   if(p<1)requestAnimationFrame(frame);
   else el.textContent=yen(to);
 }
 requestAnimationFrame(frame);
}

function changeVisitItem(k,id,name,delta){
 const v=visitsFor(k).find(x=>x.id===id);if(!v)return;
 if(delta>0){const master=ALL.find(x=>x[0]===name);v.items.push({id:uid(),name:master[0],point:master[1],quantity:1})}
 else{for(let i=v.items.length-1;i>=0;i--)if(v.items[i].name===name){if(v.items[i].quantity<=1)v.items.splice(i,1);else v.items[i].quantity--;break}}
 if(!v.items.length){deleteVisit(k,id);return} saveData();renderPastVisitEditor(k,id);
}

function commitMasterEditor(){
 const name=document.getElementById("masterNameInput").value.trim(),point=Number(document.getElementById("masterPointInput").value),cat=document.getElementById("masterCategoryInput").value;
 if(!name){alert("項目名を入力してください");return} if(!Number.isFinite(point)||point<0){alert("B−A点を0以上で入力してください");return}
 if(editingMasterIndex===null)(cat==="quick"?QUICK:OTHER).push([name,point]);
 else{const old=masterRows()[editingMasterIndex];(old.cat==="quick"?QUICK:OTHER).splice(old.index,1);(cat==="quick"?QUICK:OTHER).push([name,point])}
 saveMaster();rebuildOtherSelect();renderMain();renderSettings();closeMasterEditor();document.getElementById("masterMessage").textContent="マスターを保存しました。";
}
function deleteMasterItem(i){const r=masterRows()[i];if(!r||!confirm(`「${r.name}」を削除しますか？`))return;(r.cat==="quick"?QUICK:OTHER).splice(r.index,1);saveMaster();rebuildOtherSelect();renderMain();renderSettings()}
function moveMaster(fromG,toG){
 const rows=masterRows(),a=rows[fromG],b=rows[toG];if(!a||!b||fromG===toG)return;
 const src=a.cat==="quick"?QUICK:OTHER,item=src.splice(a.index,1)[0],dest=b.cat==="quick"?QUICK:OTHER;
 let idx=b.index;if(a.cat===b.cat&&a.index<b.index)idx--;dest.splice(Math.max(0,idx),0,item);
 saveMaster();rebuildOtherSelect();renderMain();renderSettings();
}
function setupMasterReorder(){
 if(!masterEditMode)return;let source=null,timer=null,armed=false;
 document.querySelectorAll("#masterList .master-row").forEach(row=>{
  const handle=row.querySelector(".master-drag");
  handle.addEventListener("touchstart",e=>{source=row;armed=false;timer=setTimeout(()=>{armed=true;row.classList.add("dragging")},450)},{passive:true});
  handle.addEventListener("touchmove",e=>{if(!armed)return;e.preventDefault();document.querySelectorAll(".drag-over").forEach(x=>x.classList.remove("drag-over"));const over=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY)?.closest(".master-row");if(over&&over!==source)over.classList.add("drag-over")},{passive:false});
  handle.addEventListener("touchend",()=>{clearTimeout(timer);if(armed){const over=document.querySelector(".master-row.drag-over");if(over)moveMaster(Number(source.dataset.global),Number(over.dataset.global))}document.querySelectorAll(".dragging,.drag-over").forEach(x=>x.classList.remove("dragging","drag-over"));source=null;armed=false});
 });
}
function csvCell(v){const s=String(v??"");return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportMasterCSV(){const rows=[["区分","処置名","B-A点","表示順"]];QUICK.forEach((x,i)=>rows.push(["よく使う処置",x[0],x[1],i+1]));OTHER.forEach((x,i)=>rows.push(["その他の処置",x[0],x[1],i+1]));const csv="\uFEFF"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n"),blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`診療処置マスター_${todayKey()}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function parseCSV(text){const rows=[];let row=[],cell="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else{if(c==='"')quoted=true;else if(c===","){row.push(cell);cell=""}else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell=""}else if(c!=="\r")cell+=c}}if(cell!==""||row.length){row.push(cell);rows.push(row)}return rows}
async function importMasterCSV(file){const msg=document.getElementById("masterMessage");try{let text=(await file.text()).replace(/^\uFEFF/,"");const rows=parseCSV(text).filter(r=>r.some(c=>String(c).trim()!=="")),hd=rows[0].map(x=>String(x).trim()),ci=hd.indexOf("区分"),ni=hd.indexOf("処置名"),pi=hd.indexOf("B-A点"),oi=hd.indexOf("表示順");if(ci<0||ni<0||pi<0)throw new Error("「区分・処置名・B-A点」の列が必要です");const q=[],o=[];rows.slice(1).forEach((r,i)=>{const cat=String(r[ci]||"").trim(),name=String(r[ni]||"").trim(),point=Number(String(r[pi]||"").replace(/[,，\s]/g,"")),order=oi>=0?Number(r[oi])||i+1:i+1;if(!name||!Number.isFinite(point))throw new Error(`${i+2}行目を確認してください`);(cat==="よく使う処置"?q:o).push({name,point,order})});if(!confirm(`マスターを ${q.length+o.length}件 の内容に置き換えますか？`))return;q.sort((a,b)=>a.order-b.order);o.sort((a,b)=>a.order-b.order);QUICK=q.map(x=>[x.name,x.point]);OTHER=o.map(x=>[x.name,x.point]);saveMaster();rebuildOtherSelect();renderMain();renderSettings();msg.textContent="読み込み完了"}catch(e){msg.textContent=`読み込みできませんでした：${e.message}`}}
document.getElementById("menuButton").onclick=()=>{if(editingVisitId)cancelCurrentEdit();else openMenu()};
document.getElementById("closeMenu").onclick=closeMenu;
document.getElementById("menuOverlay").onclick=e=>{if(e.target.id==="menuOverlay")closeMenu()};
document.getElementById("menuSummary").onclick=()=>{closeMenu();openSummaryScreen()};
document.getElementById("menuSettings").onclick=()=>{closeMenu();renderSettings();show("settingsView")};
document.getElementById("closeSettings").onclick=()=>show("mainView");
document.getElementById("exportMaster").onclick=exportMasterCSV;
document.getElementById("importMasterButton").onclick=()=>document.getElementById("importMasterFile").click();
document.getElementById("importMasterFile").onchange=e=>{const f=e.target.files?.[0];if(f)importMasterCSV(f);e.target.value=""};
document.getElementById("toggleMasterEdit").onclick=()=>{masterEditMode=!masterEditMode;renderSettings()};
document.getElementById("addMasterItem").onclick=()=>openMasterEditor(null);
document.getElementById("cancelMasterEditor").onclick=closeMasterEditor;
document.getElementById("saveMasterEditor").onclick=commitMasterEditor;
document.getElementById("masterEditorModal").onclick=e=>{if(e.target.id==="masterEditorModal")closeMasterEditor()};

// iOS zoom prevention retained.
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
document.addEventListener("gestureend",e=>e.preventDefault(),{passive:false});
document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
let lastTapTime=0,lastTapTarget=null,lastTapX=0,lastTapY=0;
document.addEventListener("touchend",e=>{
  const now=Date.now(),t=e.changedTouches&&e.changedTouches[0];
  const x=t?t.clientX:0,y=t?t.clientY:0;
  const sameTarget=e.target===lastTapTarget;
  const close=Math.abs(x-lastTapX)<32&&Math.abs(y-lastTapY)<32;
  if(now-lastTapTime<420&&sameTarget&&close)e.preventDefault();
  lastTapTime=now;lastTapTarget=e.target;lastTapX=x;lastTapY=y;
},{passive:false});

renderMain();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));
</script>
