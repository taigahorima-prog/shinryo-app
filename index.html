<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="診療収益">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>診療収益</title>
<style>
*{box-sizing:border-box} :root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#111;background:#f7f7f8}
body{margin:0;background:#f7f7f8}
header{position:sticky;top:0;z-index:20;background:rgba(247,247,248,.97);backdrop-filter:blur(12px);border-bottom:1px solid #ddd;padding:calc(env(safe-area-inset-top) + 8px) 16px 12px}
.nav{text-align:center;font-weight:650;font-size:17px;margin-bottom:9px}.label{font-size:14px;color:#6b6b70}.total{font-size:42px;font-weight:760;letter-spacing:-1px;margin-top:2px}
main{max-width:600px;margin:auto;padding:18px 16px calc(44px + env(safe-area-inset-bottom))}
.section{margin-bottom:28px}.section-title{display:flex;align-items:center;margin-bottom:12px}.section-title h2{font-size:20px;margin:0}.spacer{flex:1}
button,select{font:inherit}.linkbtn{border:0;background:none;color:#0677df;font-size:14px;padding:8px}
.row{display:flex;align-items:center;gap:9px;background:#fff;border-radius:13px;padding:9px 12px;margin-bottom:8px}
.info{min-width:0;flex:1}.name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-size:13px;color:#737378;margin-top:3px}
.step{width:44px;height:44px;border:1px solid #c8c8cc;border-radius:10px;background:#fff;font-size:23px}.plus{background:#087ff5;color:#fff;border-color:#087ff5}.step:disabled{opacity:.35}.count{width:28px;text-align:center;font-size:18px;font-weight:650}
hr{border:0;border-top:1px solid #d8d8dc;margin:0 0 18px}
select{width:100%;min-height:54px;border:0;border-radius:12px;background:#fff;padding:0 14px;color:#111}
.controls{display:flex;align-items:center;gap:8px;margin-top:12px}.controls .caption{font-size:14px;color:#737378;margin-right:auto}
.add{height:44px;min-width:84px;border:0;border-radius:10px;background:#087ff5;color:#fff;font-weight:650}.add:disabled{opacity:.35}
.detail{display:flex;align-items:baseline;padding:5px 0;gap:6px}.detail-name{font-size:14px}.qty{font-size:12px;color:#737378}.money{margin-left:auto;font-size:14px;font-weight:650}.empty{font-size:14px;color:#737378}
</style>
<style>
.topline{display:flex;align-items:center}.topline .nav{flex:1}.summary-btn{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 5px);border:0;background:none;color:#087ff5;font-size:16px;font-weight:600;padding:10px}
.view{display:none}.view.active{display:block}
.summary-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}.summary-head h2{flex:1;text-align:center;margin:0;font-size:20px}
.monthbtn{width:42px;height:38px;border:1px solid #c8c8cc;background:#fff;border-radius:10px;font-size:20px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:18px}.dow{text-align:center;color:#737378;font-size:12px;padding:4px 0}
.day{min-height:50px;border:0;border-radius:10px;background:#fff;padding:5px 2px;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day.blank{background:transparent}.day.today{outline:2px solid #087ff5}.day.has{font-weight:650}.day .mini{font-size:9px;color:#737378;white-space:nowrap}
.stats{background:#fff;border-radius:14px;padding:14px;margin-bottom:18px}.stats-total{font-size:30px;font-weight:750;margin:4px 0 10px}.statline{display:flex;padding:4px 0;color:#555}.statline strong{margin-left:auto;color:#111}
.daily{background:#fff;border-radius:14px;overflow:hidden}.daily-row{display:flex;align-items:center;width:100%;border:0;border-bottom:1px solid #eee;background:#fff;padding:13px 14px;text-align:left}.daily-row:last-child{border-bottom:0}.daily-row .date{font-weight:600}.daily-row .amount{margin-left:auto;font-weight:650}.backbtn{border:0;background:none;color:#087ff5;font-size:16px;padding:8px 0}.detail-title{font-size:24px;font-weight:750;margin:6px 0 2px}.detail-total{font-size:32px;font-weight:750;margin-bottom:18px}
</style>
</head>
<body>
<div id="mainView" class="view active">
<header>
  <div class="topline"><div class="nav">診療点数</div><button id="openSummary" class="summary-btn">集計</button></div>
  <div class="label">本日の収益</div><div id="total" class="total">¥0</div>
</header>
<main>
<section class="section">
<div class="section-title"><h2>よく使う処置</h2><div class="spacer"></div><button id="undo" class="linkbtn">1つ戻す</button></div>
<div id="quick"></div>
</section>
<section class="section"><hr><div class="section-title"><h2>その他の処置</h2></div>
<select id="otherSelect"><option value="">処置を選択してください</option></select>
<div class="controls"><span class="caption">個数</span><button id="qminus" class="step">−</button><span id="quantity" class="count">1</span><button id="qplus" class="step">＋</button><button id="addOther" class="add" disabled>追加</button></div>
</section>
<section class="section"><hr><div class="section-title"><h2>今日の内訳</h2><div class="spacer"></div><button id="reset" class="linkbtn">リセット</button></div><div id="details"></div></section>
</main>
</div>

<div id="summaryView" class="view">
<main>
<button id="closeSummary" class="backbtn">‹ 診療点数</button>
<div class="summary-head"><button id="prevMonth" class="monthbtn">‹</button><h2 id="monthTitle"></h2><button id="nextMonth" class="monthbtn">›</button></div>
<div id="calendar" class="calendar"></div>
<div class="stats"><div class="label">この月の収益</div><div id="monthTotal" class="stats-total">¥0</div>
<div class="statline"><span>診療日数</span><strong id="workDays">0日</strong></div>
<div class="statline"><span>1日平均</span><strong id="dayAverage">¥0</strong></div></div>
<div class="section-title"><h2>この月の一覧</h2></div><div id="dailyList" class="daily"></div>
</main>
</div>

<div id="dayView" class="view">
<main>
<button id="backToSummary" class="backbtn">‹ 月の集計</button>
<div id="dayTitle" class="detail-title"></div><div id="dayTotal" class="detail-total"></div>
<div id="dayDetails" class="daily"></div>
<div class="past-add">
<h3>この日に処置を追加</h3>
<select id="pastSelect"><option value="">処置を選択してください</option></select>
<div class="controls"><span class="caption">個数</span><button id="pastQminus" class="step">−</button><span id="pastQuantity" class="count">1</span><button id="pastQplus" class="step">＋</button><button id="pastAdd" class="add" disabled>追加</button></div>
</div>
</main>
</div>
<script>
const QUICK = [["初診", 1810], ["往診", 1420], ["点滴500ml", 2940], ["点滴1L", 3360], ["筋肉内注射", 350], ["皮下注射", 350], ["静脈内注射", 510], ["経口投薬", 660], ["洗浄（耳）", 1560], ["浣腸", 930], ["直腸検査", 1560], ["超音波検査", 1460], ["イソジン薬注", 3270], ["蹄病手術", 8160]];
const OTHER = [["PLテスト", 550], ["血中ケトン", 780], ["細菌培養検査", 650], ["感受性ディスク検査", 1540], ["CG8", 2160], ["CHEM8", 2570], ["血液検査１項目", 390], ["血液生化学的検査（５種以上７種以下）", 1970], ["血液生化学的検査（８種又は９種）", 2380], ["血液生化学的検査（１０種以上）", 2770], ["糞便検査キット1種", 500], ["糞便検査キット2種", 630], ["糞便検査キット5種", 1150], ["洗浄（眼、涙管、鼻腔、膣、包皮、臍帯）", 550], ["洗浄（乳房内）", 850], ["薬浴 調剤を必要とするもの", 780], ["薬浴 調剤を必要としないもの", 830], ["鎮静術", 810], ["点滴2L", 3780], ["点滴3L", 4200], ["点滴4L", 4620], ["経口投薬 胃カテーテルによる投薬（ガス除去）（調剤）", 2130], ["塗布又は塗擦（水剤）", 540], ["塗布又は塗擦（育剤）", 550], ["穿胃", 2160], ["その他の外科的処置", 1260], ["その他の外科的処置（伸縮性接着包帯）", 1260], ["外傷治療 小 第１回", 1910], ["外傷治療 小 第２回以後", 930], ["外傷治療 大 第１回", 4680], ["外傷治療 大 第２回以後", 1910], ["外傷治療 小 第１回（伸縮性接着包帯）", 1910], ["外傷治療 小 第２回以後（伸縮性接着包帯）", 930], ["外傷治療 大 第１回（伸縮性接着包帯）", 4680], ["外傷治療 大 第２回以後（伸縮性接着包帯）", 1910], ["外傷治療（縫合加点）", 440], ["外傷治療（ギプス包帯加点）", 0], ["外傷治療（ギプス除去）", 1380], ["切開手術 小 第１回", 2710], ["切開手術 小 第２回以後", 1560], ["切開手術 大 第１回", 6370], ["切開手術 大 第２回以後", 2190], ["開腹（牛・馬）（帝王切開）", 77320], ["開腹（牛・馬）（第四胃変位整復手術）", 62050], ["開腹（牛・馬）（第四胃変位整復手術）（捻転整復）", 78300], ["蹄病処置（伸縮性接着包帯）", 5360], ["蹄病処置（蹄底ブロック又はギプス包帯加点）", 0], ["ナックル整復（ギプス包帯）", 5010]];
const ALL = [...QUICK,...OTHER];
const OLD_KEY="shinryo.web.entries.v1";
const KEY="shinryo.web.daily.v2";
const pad=n=>String(n).padStart(2,"0");
const dateKey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey=()=>dateKey(new Date());
const yen=n=>"¥"+Number(n||0).toLocaleString("ja-JP");
let dailyData=JSON.parse(localStorage.getItem(KEY)||"{}");
if(!Object.keys(dailyData).length){
  const old=JSON.parse(localStorage.getItem(OLD_KEY)||"[]");
  if(old.length) dailyData[todayKey()]=old;
}
let entries=dailyData[todayKey()]||[];
let quantity=1;
let shownMonth=new Date(); shownMonth.setDate(1);
const save=()=>{dailyData[todayKey()]=entries;if(!entries.length)delete dailyData[todayKey()];localStorage.setItem(KEY,JSON.stringify(dailyData));};
const countFor=name=>entries.filter(e=>e.name===name).reduce((a,e)=>a+e.quantity,0);
function add(name,point,q=1){entries.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),name,point,quantity:q,createdAt:new Date().toISOString()});save();renderMain();}
function removeOne(name){let i=-1;for(let x=entries.length-1;x>=0;x--)if(entries[x].name===name){i=x;break};if(i<0)return;if(entries[i].quantity<=1)entries.splice(i,1);else entries[i].quantity--;save();renderMain();}
function grouped(es){const map=new Map();es.forEach(e=>{let g=map.get(e.name)||{quantity:0,subtotal:0};g.quantity+=e.quantity;g.subtotal+=e.point*e.quantity;map.set(e.name,g)});return ALL.filter(([n])=>map.has(n)).map(([n])=>[n,map.get(n)]);}
function totalOf(es){return es.reduce((a,e)=>a+e.point*e.quantity,0)}
function renderMain(){
 document.getElementById("total").textContent=yen(totalOf(entries));
 document.getElementById("undo").disabled=!entries.length;document.getElementById("reset").disabled=!entries.length;
 document.getElementById("quick").innerHTML=QUICK.map(([n,p])=>`<div class="row"><div class="info"><div class="name">${n}</div><div class="price">${yen(p)}</div></div><button class="step" data-minus="${n}" ${countFor(n)===0?"disabled":""}>−</button><div class="count">${countFor(n)}</div><button class="step plus" data-plus="${n}">＋</button></div>`).join("");
 document.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>{let t=QUICK.find(x=>x[0]===b.dataset.plus);add(t[0],t[1])});
 document.querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>removeOne(b.dataset.minus));
 const g=grouped(entries);document.getElementById("details").innerHTML=g.length?g.map(([n,x])=>`<div class="detail"><span class="detail-name">${n}</span><span class="qty">×${x.quantity}</span><span class="money">${yen(x.subtotal)}</span></div>`).join(""):'<div class="empty">まだ処置はありません</div>';
}
function show(id){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));document.getElementById(id).classList.add("active");window.scrollTo(0,0)}
function renderSummary(){
 const y=shownMonth.getFullYear(),m=shownMonth.getMonth();
 document.getElementById("monthTitle").textContent=`${y}年${m+1}月`;
 const prefix=`${y}-${pad(m+1)}-`;const keys=Object.keys(dailyData).filter(k=>k.startsWith(prefix)&&dailyData[k].length).sort();
 const totals=keys.map(k=>[k,totalOf(dailyData[k])]);const mt=totals.reduce((a,x)=>a+x[1],0);
 document.getElementById("monthTotal").textContent=yen(mt);document.getElementById("workDays").textContent=`${keys.length}日`;document.getElementById("dayAverage").textContent=yen(keys.length?Math.round(mt/keys.length):0);
 const cal=document.getElementById("calendar");cal.innerHTML=["日","月","火","水","木","金","土"].map(x=>`<div class="dow">${x}</div>`).join("");
 const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();
 for(let i=0;i<first;i++)cal.insertAdjacentHTML("beforeend",'<div class="day blank"></div>');
 for(let d=1;d<=last;d++){let k=`${y}-${pad(m+1)}-${pad(d)}`,amt=dailyData[k]?totalOf(dailyData[k]):0;let b=document.createElement("button");b.className="day"+(k===todayKey()?" today":"")+(amt?" has":"");b.innerHTML=`<span>${d}</span>${amt?`<span class="mini">${yen(amt)}</span>`:""}`;if(dailyData[k]?.length)b.onclick=()=>openDay(k);cal.appendChild(b)}
 const list=document.getElementById("dailyList");list.innerHTML=totals.length?totals.slice().reverse().map(([k,a])=>`<button class="daily-row" data-day="${k}"><span class="date">${Number(k.slice(5,7))}/${Number(k.slice(8,10))}</span><span class="amount">${yen(a)}</span></button>`).join(""):'<div class="empty" style="padding:14px">この月の記録はありません</div>';
 list.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>openDay(b.dataset.day));
}
let editingDay=null;
function saveDaily(){localStorage.setItem(KEY,JSON.stringify(dailyData));}
function changePast(name,delta){
 const es=dailyData[editingDay]||[];
 if(delta>0){
   const master=ALL.find(x=>x[0]===name); if(!master)return;
   es.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),name:master[0],point:master[1],quantity:1,createdAt:new Date().toISOString()});
 }else{
   for(let i=es.length-1;i>=0;i--)if(es[i].name===name){if(es[i].quantity<=1)es.splice(i,1);else es[i].quantity--;break}
 }
 if(es.length)dailyData[editingDay]=es;else delete dailyData[editingDay];
 if(editingDay===todayKey())entries=dailyData[editingDay]||[];
 saveDaily();renderMain();openDay(editingDay);
}
function deletePast(name){
 if(!confirm(`「${name}」をこの日の記録から削除しますか？`))return;
 const es=(dailyData[editingDay]||[]).filter(e=>e.name!==name);
 if(es.length)dailyData[editingDay]=es;else delete dailyData[editingDay];
 if(editingDay===todayKey())entries=dailyData[editingDay]||[];
 saveDaily();renderMain();openDay(editingDay);
}
function openDay(k){
 editingDay=k;const es=dailyData[k]||[];
 document.getElementById("dayTitle").textContent=`${Number(k.slice(0,4))}年${Number(k.slice(5,7))}月${Number(k.slice(8,10))}日`;
 document.getElementById("dayTotal").textContent=yen(totalOf(es));
 const g=grouped(es), box=document.getElementById("dayDetails");
 box.innerHTML=g.length?g.map(([n,x])=>`<div class="edit-row"><div class="edit-info"><div class="edit-name">${n}</div><div class="edit-sub">${yen(x.subtotal)}</div></div><button class="step" data-pminus="${n}">−</button><span class="edit-count">${x.quantity}</span><button class="step plus" data-pplus="${n}">＋</button><button class="delete-btn" data-pdelete="${n}">削除</button></div>`).join(""):'<div class="empty" style="padding:14px">この日の処置はありません</div>';
 box.querySelectorAll("[data-pminus]").forEach(b=>b.onclick=()=>changePast(b.dataset.pminus,-1));
 box.querySelectorAll("[data-pplus]").forEach(b=>b.onclick=()=>changePast(b.dataset.pplus,1));
 box.querySelectorAll("[data-pdelete]").forEach(b=>b.onclick=()=>deletePast(b.dataset.pdelete));
 show("dayView");
}
const sel=document.getElementById("otherSelect");OTHER.forEach(([n,p],i)=>{let o=document.createElement("option");o.value=i;o.textContent=`${n}　+${p.toLocaleString("ja-JP")}`;sel.appendChild(o)});sel.onchange=()=>document.getElementById("addOther").disabled=sel.value==="";
document.getElementById("qminus").onclick=()=>{quantity=Math.max(1,quantity-1);document.getElementById("quantity").textContent=quantity};
document.getElementById("qplus").onclick=()=>{quantity=Math.min(99,quantity+1);document.getElementById("quantity").textContent=quantity};
document.getElementById("addOther").onclick=()=>{if(sel.value==="")return;let[n,p]=OTHER[Number(sel.value)];add(n,p,quantity);sel.value="";quantity=1;document.getElementById("quantity").textContent=1;document.getElementById("addOther").disabled=true};
document.getElementById("undo").onclick=()=>{if(entries.length){entries.pop();save();renderMain()}};
document.getElementById("reset").onclick=()=>{if(entries.length&&confirm("今日の入力をすべて削除しますか？")){entries=[];save();renderMain()}};
document.getElementById("openSummary").onclick=()=>{renderSummary();show("summaryView")};
document.getElementById("closeSummary").onclick=()=>show("mainView");
document.getElementById("backToSummary").onclick=()=>{renderSummary();show("summaryView")};
document.getElementById("prevMonth").onclick=()=>{shownMonth.setMonth(shownMonth.getMonth()-1);renderSummary()};
document.getElementById("nextMonth").onclick=()=>{shownMonth.setMonth(shownMonth.getMonth()+1);renderSummary()};

let pastQuantity=1;
const pastSel=document.getElementById("pastSelect");
ALL.forEach(([n,p],i)=>{let o=document.createElement("option");o.value=i;o.textContent=`${n}　+${p.toLocaleString("ja-JP")}`;pastSel.appendChild(o)});
pastSel.onchange=()=>document.getElementById("pastAdd").disabled=pastSel.value==="";
document.getElementById("pastQminus").onclick=()=>{pastQuantity=Math.max(1,pastQuantity-1);document.getElementById("pastQuantity").textContent=pastQuantity};
document.getElementById("pastQplus").onclick=()=>{pastQuantity=Math.min(99,pastQuantity+1);document.getElementById("pastQuantity").textContent=pastQuantity};
document.getElementById("pastAdd").onclick=()=>{
 if(pastSel.value===""||!editingDay)return;
 let[n,p]=ALL[Number(pastSel.value)],es=dailyData[editingDay]||[];
 es.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),name:n,point:p,quantity:pastQuantity,createdAt:new Date().toISOString()});
 dailyData[editingDay]=es;
 if(editingDay===todayKey())entries=es;
 saveDaily();renderMain();
 pastSel.value="";pastQuantity=1;document.getElementById("pastQuantity").textContent=1;document.getElementById("pastAdd").disabled=true;
 openDay(editingDay);
};

// v2.4: iOS Safari/PWA のピンチ・ダブルタップ拡大を抑止
document.addEventListener("gesturestart", e => e.preventDefault(), {passive:false});
document.addEventListener("gesturechange", e => e.preventDefault(), {passive:false});
document.addEventListener("gestureend", e => e.preventDefault(), {passive:false});
document.addEventListener("touchmove", e => {
  if (e.touches && e.touches.length > 1) e.preventDefault();
}, {passive:false});
let lastTouchEnd = 0;
document.addEventListener("touchend", e => {
  const now = Date.now();
  if (now - lastTouchEnd <= 350) e.preventDefault();
  lastTouchEnd = now;
}, {passive:false});

renderMain();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));
</script></body></html>
